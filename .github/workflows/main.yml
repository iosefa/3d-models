name: Deploy Potree (pre-built bundle)

on:
  push:
    branches: [ main ]

env:
  AWS_REGION:      us-west-1
  S3_BUCKET:       3d-sefa
  DISTRIBUTION_ID: E2XWTFZCKFMWL3
  POTREE_VERSION:  1.8.2          # bump when you upgrade Potree

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ─── pull code ───
      - uses: actions/checkout@v4
        with: { persist-credentials: false, clean: false }

      # ─── download & locate bundle ───
      - name: Download Potree dist
        id: potree
        run: |
          set -euo pipefail
          curl -L -o potree.zip \
            "https://github.com/potree/potree/releases/download/${POTREE_VERSION}/Potree_${POTREE_VERSION}.zip"
          
          unzip -q potree.zip                     # → Potree_${POTREE_VERSION}/…
          EXTRACT_DIR=$(echo Potree_*)            # shell-expand to folder name
          echo "Extracted to $EXTRACT_DIR"
          
          # Path where potree.js lives
          echo "bundle-path=$EXTRACT_DIR/build/potree" >> "$GITHUB_OUTPUT"
          
          # quick sanity check
          test -f "$EXTRACT_DIR/build/potree/potree.js"
          ls -lh "$EXTRACT_DIR/build/potree/potree.js"

      # ─── stage static site ───
      - name: Prepare site folder
        run: |
          set -euo pipefail
          rm -rf site && mkdir -p site/build
          cp -r "${{ steps.potree.outputs.bundle-path }}" site/build
          cp -r libs models resources thumbnails site/ || true
          cp index.html site/
          echo "------ staged files ----------"
          ls -lh site/build/potree/potree.js site/build/potree/potree.css
          echo "--------------------------------"

      # ─── AWS credentials ───
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ─── upload + invalidate ───
      - name: Sync site → bucket root
        run: aws s3 sync site "s3://${S3_BUCKET}" --delete --no-progress

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation \
          --distribution-id $DISTRIBUTION_ID \
          --paths '/*'