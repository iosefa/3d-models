name: Deploy Potree (use pre-built bundle)

on:
  push:
    branches: [ main ]

env:
  AWS_REGION:      us-west-1
  S3_BUCKET:       3d-sefa
  DISTRIBUTION_ID: E2XWTFZCKFMWL3
  POTREE_VERSION:  1.8.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, clean: false }

      # ─── grab the bundle (≈1 MB) ───
      - name: Download Potree dist
        run: |
          curl -L -o potree.zip \
            "https://github.com/potree/potree/releases/download/v${POTREE_VERSION}/potree-${POTREE_VERSION}-web.zip"
          unzip -q potree.zip -d potree-dist
          ls -lh potree-dist/build/potree/potree.js

      # ─── stage site ───
      - name: Prepare site
        run: |
          set -euo pipefail
          rm -rf site && mkdir -p site/build
          cp -r potree-dist/build/potree  site/build
          cp -r libs models resources thumbnails site/ || true
          cp index.html                   site/

      # ─── AWS creds & upload ───
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Sync site → S3
        run: aws s3 sync site "s3://${S3_BUCKET}" --delete --no-progress

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation \
          --distribution-id "$DISTRIBUTION_ID" --paths "/*"
